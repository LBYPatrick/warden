name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: make format test build
      - run: build/warden --help
      - run: bash tests/install.sh
      - run: bash tests/cli.sh
